name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài dependencies
        run: npm ci
      - name: Kiểm tra kiểu (src)
        run: npm run typecheck
      - name: Kiểm tra kiểu (tests)
        run: npm run typecheck:test
      - name: ESLint
        run: npm run lint
      - name: Chạy vitest
        run: npm test
      - name: Build
        run: npm run build
